<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Ways Incheon - 3초 판단 도우미</title>
    <meta name="description" content="AI와 데이터로 실천하는 학교 자원순환 UX 개선 프로젝트" />
    <link rel="icon" type="image/png" href="/assets/brand/aiways-logo.png" />
    <!-- CSP는 2026-09-01 Firebase Hosting 이전과 함께 firebase.json의
         hosting.headers로 옮겼다(../index.html과 동일한 이유). -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Ways Incheon | 버리는 순간을 기록하세요." />
    <meta property="og:description" content="AI와 데이터로 실천하는 학교 자원순환 UX 개선 프로젝트" />
    <meta property="og:image" content="https://incheon.edutogether.kr/assets/brand/mobile-og-thumbnail.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://incheon.edutogether.kr/mobile/index.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Ways Incheon | 버리는 순간을 기록하세요." />
    <meta name="twitter:description" content="AI와 데이터로 실천하는 학교 자원순환 UX 개선 프로젝트" />
    <meta name="twitter:image" content="https://incheon.edutogether.kr/assets/brand/mobile-og-thumbnail.jpg" />
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6 text-slate-800">

    <!-- 접속 게이트 겸 부트 스플래시.
         스타일을 인라인으로 적는 이유: Tailwind와 mobile.css는 외부 파일이라
         도착하기 전까지 이 화면이 스타일 없는 맨 글자로 그려진다. 인라인
         스타일은 HTML과 함께 도착하므로, 새 탭을 열자마자 첫 프레임부터
         브랜드 화면이 보인다. 배경색은 앱 본체와 같은 #f1f5f9라서 앱이
         열릴 때 색이 튀지 않는다.
         authGate.js가 이 안의 내용을 다시 그리므로 id 두 개는 유지해야 한다. -->
    <div id="authGate" class="fixed inset-0 z-[999] flex items-center justify-center p-4"
         style="position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;background:#f1f5f9;transition:opacity .4s ease">
        <div id="authGateContent" class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100"
             style="width:100%;max-width:24rem;padding:32px 24px;border-radius:24px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 20px 45px rgba(15,23,42,.12)">
            <div style="display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center">
                <img src="/assets/brand/aiways-logo.png" alt="" width="56" height="56"
                     style="width:56px;height:56px;object-fit:contain;border-radius:16px" />
                <div>
                    <div style="color:#2563eb;font-size:13px;font-weight:800;letter-spacing:.34em;padding-left:.34em">AI WAYS INCHEON</div>
                    <div style="margin-top:8px;color:#0f172a;font-size:20px;font-weight:800;letter-spacing:-.01em">♻️ 3초 판단 도우미</div>
                </div>
                <div style="width:150px;height:3px;border-radius:99px;background:rgba(37,99,235,.18);overflow:hidden">
                    <div style="width:40%;height:100%;border-radius:99px;background:#2563eb;animation:aiways-boot-bar 1.1s ease-in-out infinite"></div>
                </div>
                <p style="margin:0;color:#64748b;font-size:12px;font-weight:600">접속을 준비하고 있습니다.</p>
            </div>
        </div>
        <style>@keyframes aiways-boot-bar{0%{margin-left:-40%}100%{margin-left:100%}}</style>
    </div>

    <!-- 인증 후에만 노출되는 3초 판단 앱.
         이 div 자체는 리액트가 소유하지 않는다 - authGate.js가 인증을
         통과시킬 때 여기서 hidden 클래스를 떼는데, 리액트가 이 요소를
         다시 그리면 그 조작이 지워지기 때문이다. 리액트는 이 안쪽만
         그린다(createRoot의 컨테이너로 쓴다). -->
    <div id="appRoot" class="hidden w-full flex flex-col items-center"></div>

    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
