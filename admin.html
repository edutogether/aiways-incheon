<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Ways Incheon · 관리자</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/brand/aiways-logo.png" />
    <!-- 이 페이지는 어디에도 링크돼 있지 않다(사이트 내비게이션에 없음) -
         하지만 실제 보안은 링크 유무가 아니라 서버(superadmin 커스텀 클레임
         검증)에서 강제된다. 로그인 없이 발급을 누르면 서버가 401로 거절하는
         것을 에뮬레이터로 실행해 확인했다. -->
    <!-- CSP는 2026-09-01 Firebase Hosting 이전과 함께 firebase.json의
         hosting.headers로 옮겼다(index.html과 동일한 이유). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" />
    <style>
      /* 🔴 이 한 줄이 없으면 hidden 속성이 무력화된다(2026-09-09 Bumm님이 화면을
         열어보고 지적하셨다 - 로그인 전인데 발급 화면이 그대로 보였다).
         브라우저 기본 스타일의 [hidden]{display:none}은 **작성자 스타일에 진다.**
         아래 section 규칙이 display:grid를 걸어 두었으므로, hidden 속성이 붙어
         있어도 계속 그려졌다. admin.js가 로그인 성공 시 hidden=false로 바꾸지만
         애초에 숨겨진 적이 없었다. tests/adminAuthGate.spec.js가 이걸 지킨다. */
      [hidden] { display: none !important; }

      /* 학생 앱(mobile/)과 같은 폰트·색·여백을 쓴다(2026-09-10 Bumm님 지시).
         같은 프로젝트의 화면이 서로 남처럼 보이면 안 된다. */
      * { box-sizing: border-box; }
      body {
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f5f9; color: #1e293b;
        display: grid; place-items: start center; min-height: 100vh; margin: 0; padding: 2rem 1rem 3rem;
      }
      main { width: min(430px, 100%); display: grid; gap: 1rem; }
      section {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem;
        padding: 1.75rem 1.5rem; display: grid; gap: .75rem;
        box-shadow: 0 1px 2px rgb(15 23 42 / 4%), 0 8px 24px rgb(15 23 42 / 6%);
      }
      /* 제목은 카드 밖이 아니라 카드 안에, 가운데. */
      .card-title { text-align: center; display: grid; gap: .3rem; margin-bottom: .5rem; }
      .card-title h1 { font-size: 1.15rem; font-weight: 800; margin: 0; letter-spacing: -.01em; }
      .card-title p { font-size: .8rem; color: #64748b; margin: 0; }
      label { font-size: .78rem; font-weight: 600; color: #475569; margin-bottom: -.4rem; }
      label[for="teacherCodeAddMode"] { display: flex; align-items: center; gap: .45rem; color: #1e293b; font-size: .85rem; font-weight: 600; margin: .5rem 0 0; }
      input[type="text"], input[type="email"], input[type="password"], select {
        width: 100%; padding: .7rem .8rem; border-radius: .6rem; border: 1px solid #cbd5e1;
        background: #fff; color: #1e293b; font-family: inherit; font-size: .9rem;
      }
      input:focus, select:focus { outline: 2px solid #6366f1; outline-offset: -1px; border-color: #6366f1; }
      input[readonly] { background: #f8fafc; color: #64748b; }
      button {
        padding: .75rem .9rem; border-radius: .6rem; border: none;
        background: #4f46e5; color: #fff; font-family: inherit; font-weight: 700; font-size: .9rem; cursor: pointer;
      }
      button:hover { background: #4338ca; }
      button:disabled { background: #cbd5e1; cursor: not-allowed; }
      /* 세 단계 사이를 벌려서, 위에서 아래로 따라갈 수 있게. */
      .step {
        font-size: .82rem; font-weight: 700; color: #4f46e5; margin: 1.35rem 0 .3rem;
        border-top: 1px solid #e2e8f0; padding-top: 1.35rem;
      }
      .step:first-of-type { border-top: none; padding-top: 0; margin-top: .25rem; }
      p[role="status"] { font-size: .8rem; color: #64748b; margin: 0; min-height: 1em; }
      #teacherCodeHint, #teacherCodeClassSource, #teacherCodeReplaceNote { font-size: .78rem; color: #64748b; margin: 0; line-height: 1.5; }
      #teacherCodeReplaceNote:not(:empty) { color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: .5rem; padding: .5rem .6rem; }
      /* 학교 검색 결과 - 학생 앱의 자동완성과 같은 모양. */
      #teacherCodeSchoolResults:empty, #teacherCodeSchoolStatus:empty { display: none; }
      #teacherCodeSchoolResults { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; max-height: 15rem; overflow-y: auto; }
      #teacherCodeSchoolResults li button {
        width: 100%; text-align: left; background: #f8fafc; color: #1e293b; border: 1px solid #e2e8f0;
        font-weight: 500; padding: .6rem .7rem; font-size: .85rem;
      }
      #teacherCodeSchoolResults li button:hover { background: #eef2ff; border-color: #c7d2fe; }
      #teacherCodeSchoolResults small { display: block; color: #64748b; font-size: .75rem; margin-top: .15rem; }
      .chosen { display: flex; align-items: center; justify-content: space-between; gap: .5rem; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: .6rem; padding: .6rem .7rem; font-size: .88rem; font-weight: 600; }
      .chosen button { background: none; color: #4f46e5; font-size: .78rem; padding: .2rem .3rem; text-decoration: underline; }
      .chosen button:hover { background: none; color: #3730a3; }
    </style>
  </head>
  <body>
    <main>
      <section id="loginSection">
        <div class="card-title">
          <h1>AI Ways Incheon 관리자</h1>
          <p>교사 인증코드를 발급하는 곳입니다.</p>
        </div>
        <label for="adminEmail">이메일</label>
        <input type="email" id="adminEmail" placeholder="관리자 계정 이메일" autocomplete="username" />
        <label for="adminPassword">비밀번호</label>
        <input type="password" id="adminPassword" autocomplete="current-password" />
        <button type="button" id="adminLoginBtn">로그인</button>
        <p id="adminLoginStatus" role="status" aria-live="polite"></p>
      </section>
      <section id="teacherCodeSection" hidden>
        <div class="card-title">
          <h1>교사 인증코드</h1>
          <p>학교와 반을 고르면 그 반의 코드를 만들어 드립니다.</p>
        </div>

        <!-- 2026-09-10(Bumm님 지시): 첫 칸이 "학교 코드(NEIS 표준학교코드,
             숫자)"였다. 그 숫자를 아는 사람은 없다. **학생 앱과 같은 학교
             검색**으로 바꾸고 숫자 칸은 화면에서 없앴다. 고른 학교의 코드는
             아래 hidden 칸에만 담긴다(사람이 볼 값이 아니다). -->
        <p class="step">① 학교 찾기</p>
        <label for="teacherCodeSchoolQuery" id="teacherCodeSchoolQueryLabel">학교 이름</label>
        <input type="text" id="teacherCodeSchoolQuery" placeholder="예: 인천서흥초" autocomplete="off" />
        <ul id="teacherCodeSchoolResults"></ul>
        <p id="teacherCodeSchoolChosen" class="chosen" hidden>
          <span id="teacherCodeSchoolChosenName"></span>
          <button type="button" id="teacherCodeSchoolReset">다시 고르기</button>
        </p>
        <p id="teacherCodeSchoolStatus" role="status" aria-live="polite"></p>
        <input type="hidden" id="teacherCodeSchoolId" />

        <!-- 2026-09-09(Bumm님 지시): 학년·반을 숫자로 직접 치던 것을 고르는
             방식으로 바꿨다. 없는 반의 코드가 발급되면 아무도 쓸 수 없는
             코드가 생기고, 현장에서 왜 안 되는지 아무도 모른다.
             학급 수 출처는 NEIS 학급정보(schoolClassCounts.js). -->
        <p class="step">② 학년·반 고르기</p>
        <label for="teacherCodeGrade">학년</label>
        <select id="teacherCodeGrade"><option value="">학년</option></select>
        <label for="teacherCodeClassNum">반</label>
        <select id="teacherCodeClassNum"><option value="">반</option></select>
        <p id="teacherCodeClassSource"></p>

        <p class="step">③ 코드 확인하고 발급</p>
        <label for="teacherCodeValue" id="teacherCodeValueLabel">이 반의 인증코드</label>
        <input type="text" id="teacherCodeValue" placeholder="학교·학년·반을 고르면 자동으로 채워집니다" />
        <p id="teacherCodeHint"></p>
        <p id="teacherCodeReplaceNote"></p>
        <!-- 2026-09-09(Bumm님 결정): 한 반이 코드를 여러 개 받는다.
             다른 반 선생님들은 규칙 코드(SEOHEUNG103)를 쓰고, 네 분은
             개인 코드(EDU2G SANGHYUN)를 쓰는데 **둘 다 통해야 한다.**
             체크하면 기존 코드를 두고 하나 더 붙인다.
             🔴 체크박스 바로 아래 칸이 "추가할 코드를 적는 칸"으로 읽힌다는
             지적을 받아, 실제로 그렇게 만들었다 - 위 칸에 개인 코드를 적고
             아래 칸에 이름을 적는 구조는 만든 사람만 안다. 칸이 아예 다르니
             자동 채움이 추가 코드를 덮어쓸 길도 구조적으로 없다. -->
        <label for="teacherCodeAddMode">
          <input type="checkbox" id="teacherCodeAddMode" />
          추가 코드 등록
        </label>
        <label for="teacherCodeExtra" id="teacherCodeExtraLabel" hidden>등록할 추가 코드</label>
        <input type="text" id="teacherCodeExtra" placeholder="예: EDU2G SANGHYUN" hidden />
        <label for="teacherCodeLabel" id="teacherCodeLabelLabel" hidden>누구 것인지 (예: 박상현)</label>
        <input type="text" id="teacherCodeLabel" placeholder="박상현" hidden />
        <!-- 버튼 글자가 상황에 따라 바뀐다. 두 개를 빗금으로 붙여두면 지금
             무엇을 하는 건지가 여전히 안 보이기 때문이다. -->
        <button type="button" id="teacherCodeSubmitBtn">코드 발급</button>
        <p id="teacherCodeStatus" role="status" aria-live="polite"></p>
      </section>
    </main>
    <!-- 학급 수 자료. admin.js보다 먼저 와야 한다. -->
    <script defer src="./schoolClassCounts.js"></script>
    <script defer src="./firebaseAppCheck.js"></script>
    <script defer src="./admin.js"></script>
  </body>
</html>
