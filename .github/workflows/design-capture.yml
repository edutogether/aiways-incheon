name: AI Ways Design Capture
on:`n  push:`n    branches:`n      - chore/design-capture-20260806`n  workflow_dispatch:
permissions:`n  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    env:`n  CAPTURE_OUTPUT: "${{ github.workspace }}/AIWays_True_PreRefactor_Candidates_20260806"
    steps:
      - uses: actions/checkout@v4
        with:`n          path: workflow
      - uses: actions/checkout@v4
        with:`n          ref: ca826721b7744a99010f0d7927e927776501d23f`n          path: versions/candidate-a
      - uses: actions/checkout@v4
        with:`n          ref: 0bb24435422651a482838a2119f55a4502196e69`n          path: versions/candidate-b
      - uses: actions/checkout@v4
        with:`n          ref: 741206db6255b6c4db58696d818d07149c909390`n          path: versions/candidate-c
      - uses: actions/checkout@v4
        with:`n          ref: cc9390c8be1236efc2850bd77c1eb5ecf4127a96`n          path: versions/current
      - uses: actions/setup-node@v4
        with:`n          node-version: 22
      - run: npm install
        working-directory: workflow/tools/design-capture
      - run: npx playwright install --with-deps chromium
        working-directory: workflow/tools/design-capture
      - run: node capture.mjs "$GITHUB_WORKSPACE/versions" "$CAPTURE_OUTPUT"
        working-directory: workflow/tools/design-capture
      - run: test -f "$CAPTURE_OUTPUT/06_inventory/capture-inventory.csv"; test -f "$CAPTURE_OUTPUT/06_inventory/README.md"; test "$(find "$CAPTURE_OUTPUT" -name '*.png' -size +0c | wc -l)" -ge 9; test "$(find "$CAPTURE_OUTPUT/05_contact_sheets" -name 'compare-all-*.png' | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:`n          name: AIWays_True_PreRefactor_Candidates_20260806`n          path: "${{ github.workspace }}/AIWays_True_PreRefactor_Candidates_20260806"`n          if-no-files-found: error
