<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Ways Incheon · 관리자</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- 이 페이지는 어디에도 링크돼 있지 않다(사이트 내비게이션에 없음) -
         하지만 실제 보안은 링크 유무가 아니라 서버(manageTeacherCode의
         superadmin 커스텀 클레임 검증)에서 강제된다. -->
    <!-- CSP는 2026-09-01 Firebase Hosting 이전과 함께 firebase.json의
         hosting.headers로 옮겼다(index.html과 동일한 이유). -->
    <style>
      body { font-family: -apple-system, "Pretendard", sans-serif; background: #0f172a; color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      main { width: min(420px, 92vw); display: grid; gap: 1.25rem; }
      h1 { font-size: 1.1rem; margin: 0; }
      h2 { font-size: 0.95rem; margin: 0 0 .5rem; }
      section { background: #1e293b; border-radius: .75rem; padding: 1.25rem; display: grid; gap: .6rem; }
      input { padding: .6rem .7rem; border-radius: .5rem; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: .9rem; }
      button { padding: .6rem .8rem; border-radius: .5rem; border: none; background: #2563eb; color: #fff; font-weight: 700; font-size: .85rem; cursor: pointer; }
      button:hover { background: #1d4ed8; }
      p[role="status"] { font-size: .8rem; color: #94a3b8; margin: 0; min-height: 1em; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Ways Incheon 관리자</h1>
      <section id="loginSection">
        <h2>로그인</h2>
        <input type="email" id="adminEmail" placeholder="이메일" autocomplete="username" />
        <input type="password" id="adminPassword" placeholder="비밀번호" autocomplete="current-password" />
        <button type="button" id="adminLoginBtn">로그인</button>
        <p id="adminLoginStatus" role="status" aria-live="polite"></p>
      </section>
      <section id="teacherCodeSection" hidden>
        <h2>교사 인증코드 발급/회전</h2>
        <input type="text" id="teacherCodeSchoolId" placeholder="학교 코드 (NEIS 표준학교코드, 숫자)" />
        <input type="text" inputmode="numeric" maxlength="2" id="teacherCodeGrade" placeholder="학년" />
        <input type="text" inputmode="numeric" maxlength="2" id="teacherCodeClassNum" placeholder="반" />
        <input type="text" id="teacherCodeValue" placeholder="새 인증코드 (학교·학년·반을 넣으면 자동으로 채워집니다)" />
        <p id="teacherCodeHint"></p>
        <!-- 2026-09-09(Bumm님 결정): 한 반이 코드를 여러 개 받는다.
             다른 반 선생님들은 규칙 코드(SEOHEUNG103)를 쓰고, 네 분은
             개인 코드(EDU2G SANGHYUN)를 쓰는데 **둘 다 통해야 한다.**
             체크하면 기존 코드를 두고 하나 더 붙인다. -->
        <label for="teacherCodeAddMode">
          <input type="checkbox" id="teacherCodeAddMode" />
          기존 코드를 두고 <strong>추가</strong>로 등록 (예: 담임 개인 코드 <code>EDU2G SANGHYUN</code>)
        </label>
        <input type="text" id="teacherCodeLabel" placeholder="추가 코드를 누구 것으로 적어둘지 (예: 박상현) — 추가 등록일 때만" />
        <button type="button" id="teacherCodeSubmitBtn">발급/회전</button>
        <p id="teacherCodeStatus" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script defer src="./firebaseAppCheck.js"></script>
    <script defer src="./admin.js"></script>
  </body>
</html>
