name: AI Ways Design Capture
on:
  push:
    branches: [chore/design-capture-20260806]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: workflow}
      - uses: actions/checkout@v4
        with: {ref: bf97d593bf5ed93fe00d2799035d86fa253e293b, path: versions/previous}
      - uses: actions/checkout@v4
        with: {ref: cc9390c8be1236efc2850bd77c1eb5ecf4127a96, path: versions/current}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
        working-directory: workflow/tools/design-capture
      - run: npx playwright install --with-deps chromium
        working-directory: workflow/tools/design-capture
      - run: node capture.mjs ../../versions/previous ../../versions/current ../../AIWays_Before_After_Design_20260806
        working-directory: workflow/tools/design-capture
      - uses: actions/upload-artifact@v4
        with: {name: AIWays_Before_After_Design_20260806, path: AIWays_Before_After_Design_20260806}
