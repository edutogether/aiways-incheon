name: Deploy

# 2026-09-01: GitHub Pages에서 Firebase Hosting으로 이전(Bumm님 지시) -
# 예전 .github/workflows/deploy-pages.yml을 대체한다. GitHub Pages 시절
# 겪었던 "레거시 브랜치 배포가 저장소 전체를 공개했던" 사고(functions/
# 백엔드 소스, 인수인계 문서 등이 실제로 노출됐음 - CLAUDE.md 참고)를
# 반복하지 않도록, Firebase Hosting도 여전히 scripts/stageHostingSite.js로
# 화이트리스트 스테이징한 파일만 배포한다(firebase.json의
# hosting.public이 그 스테이징 결과물만 가리킴).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 2026-09-01 종합감사(B그룹 7번): cancel-in-progress:true였을 때, deploy-backend
# (rules+functions)와 deploy-hosting이 별도 job이라 그 사이에 새 푸시가 들어오면
# 이전 실행이 "백엔드만 배포된 채" 취소돼 프론트/백엔드 버전이 어긋난 상태가
# 조용히 남을 수 있었다. false로 바꿔 이미 시작된 배포는 끝까지 순서대로
# 완료시키고, 대신 새 푸시는 큐에 쌓여 기다린다(배포가 몇 분 늦게 나갈 순
# 있어도 절반만 배포된 상태보다 안전).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 2026-08-27 추가: 이 저장소엔 배포 전 테스트를 자동으로 돌리는 CI가
  # 전혀 없었다 - functions/의 유닛테스트 120여 개가 전부 로컬에서
  # 수동으로만 돌고 있어서, 실제로 프로덕션을 통째로 막았던 버그(90일
  # 삭제 필드 제거 후 index.js가 그 필드를 여전히 참조해 saveSortingRecord가
  # 전부 500으로 실패)가 테스트 120/120 초록불인 채로 배포까지 나갔다.
  # 이 job이 그 배선 검증 게이트다 - 테스트가 실패하면 아래 deploy-backend/
  # deploy-hosting 둘 다 아예 실행되지 않는다(needs: test).
  # 2026-08-29 추가: firestore.rules 에뮬레이터 스모크테스트도 여기 포함.
  # 규칙 자체는 "전부 deny"라 문법 오류는 `firebase deploy`가 잡아주지만,
  # 누군가 실수로 규칙을 느슨하게 고쳐도 문법은 유효해서 배포가 그냥
  # 성공해버리는 경우까진 문법검사로 못 잡는다 - 실제 에뮬레이터에 붙여서
  # "인증 없는 클라이언트 직접 read/write가 여전히 거부되는지" 확인한다.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      # 2026-09-07 추가(D:\Projects\_shared\CONVENTIONS.md 5.2) - eslint
      # 통일. 기존 "check"(node --check, 문법검사만)는 그대로 두고 별도 게이트로 추가.
      - name: Lint
        run: npm run lint

      # 2026-09-07 - D:\Projects\_shared\CONVENTIONS.md 5.1 이전 1단계(A군).
      # test/*.test.js 40개(에뮬레이터 없이 도는 순수 유닛테스트)를
      # node --test에서 vitest로 전환 - "npm test"가 이제 vitest run을
      # 돌린다(스크립트만 바뀜, 이 스텝 자체는 그대로). emulator:test:*
      # 21개(B군)는 이 단계 대상이 아니라 아직 firebase emulators:exec +
      # node --test 조합 그대로다.
      - name: Run unit tests
        run: npm test

      - name: Setup Java (Firestore emulator dependency)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # 2026-09-07 - vitest 이전 완료(D:\Projects\_shared\CONVENTIONS.md 5.1).
      # 이 아래 emulator:test:* 21개(B군) 전부 내부 실행기가 node에서
      # vitest로 바뀌었다 - npm 스크립트 이름/이 스텝들은 전부 그대로라
      # 아래 각 스텝 자체는 변경 없음. test:frontend:layout/visual/states는
      # 이전 대상이 아니다(CDP 기반 브라우저 스크립트). gate1:final/
      # gate2a:final(존재하지 않는 파일 참조 + npm.cmd 하드코딩으로 Windows
      # 전용이라 이미 깨져 있던 죽은 코드, 역할은 이번 A/B군 vitest
      # 테스트로 완전히 대체됨)은 삭제함.
      - name: Firestore rules emulator smoke test
        run: npm run emulator:test:firestore-rules

      # 2026-08-31 추가: 교사 인증(1단계, verifyTeacherCode/checkTeacherStatus)
      # 실제 트랜잭션 경로(코드 오답/미설정 학교/정답 시 teacherVerified 기록)를
      # 에뮬레이터로 검증한다 - 다른 단계 확인용 emulator:test:* 스크립트들과
      # 같은 이유(부품 단위 유닛테스트만으로는 안 잡히는 배선 오류 방지).
      # 2026-09-07 - vitest 이전 2단계(B군, D:\Projects\_shared\CONVENTIONS.md
      # 5.1). 이 아래 스텝들은
      # firebase emulators:exec가 매번 새로 띄우는 별도 에뮬레이터 프로세스
      # 안에서 여전히 한 파일씩 단독 실행된다(vitest.emulator.config.js +
      # CLI 파일 필터) - npm run 스크립트 이름/이 스텝은 그대로, 내부 실행기만
      # node에서 vitest로 바뀜.
      - name: Teacher auth emulator integration test
        run: npm run emulator:test:teacher-auth

      # 2026-09-07 종합감사 추가: 교사코드 반별 실패 잠금(verifyTeacherCodeCore) -
      # 연속 실패가 쌓이면 잠기고, 잠긴 동안은 맞는 코드로도 거부되며,
      # 시간이 지나면 풀리고, 성공하면 카운터가 리셋되는지 실제로 검증한다.
      - name: Teacher code lockout emulator integration test
        run: npm run emulator:test:teacher-code-lockout
      # 2026-09-09: 가입 승인 대기열을 없애고 교사 사후정리로 대체했다 -
      # 반 스코프 강제, 차단이 실제 403을 내는지, 차단 시 번호 점유가 풀려
      # 다시 가입되는지, 삭제 건수가 실제와 맞는지를 검증한다.

      - name: Teacher moderation emulator integration test
        run: npm run emulator:test:teacher-moderation

      # 2026-08-31 추가: 슈퍼어드민(4단계, manageTeacherCode) - 클레임 없는
      # 로그인 사용자는 거절되고, 클레임을 받은 뒤 발급한 코드가 실제로
      # verifyTeacherCode에서 통하는지까지(Firestore에 해시만 써졌다는 것
      # 이상으로) 끝까지 확인한다.
      - name: Superadmin emulator integration test
        run: npm run emulator:test:superadmin

      # 2026-09-09 추가: 발급 화면의 버튼이 "발급"인지 "교체"인지를 정하는
      # 값이라, 틀리면 화면이 "발급"이라 말하면서 있던 코드를 교체한다.
      # 발급 전/후로 답이 실제로 갈리는지와, 코드·해시·솔트가 응답에
      # 섞이지 않는지를 확인한다.
      - name: Teacher code status emulator integration test
        run: npm run emulator:test:teacherCodeStatus

      # 2026-08-31 추가: CSV 반전체 내보내기(5단계, exportClassRecords) -
      # 학교+학년+반 스코프 격리(다른 반/다른 학교 기록이 안 섞이는지)를
      # collectionGroup 쿼리 실제 실행으로 검증한다.
      - name: Class export emulator integration test
        run: npm run emulator:test:class-export

      # 2026-09-02 추가: 비용절감 4번(실시간 리스너 마이그레이션) 1단계 -
      # getSchoolDashboard의 school-lock 확정 시점에 dashboardSchoolId 커스텀
      # 클레임이 실제로 심기는지, firestore.rules가 그 클레임만으로 반 집계
      # (PII 없음)는 열고 개인 실명이 든 students 서브컬렉션은 계속 막는지를
      # 실제 Auth+Firestore 에뮬레이터로 끝까지 검증한다.
      - name: Dashboard school claim emulator integration test
        run: npm run emulator:test:dashboard-school-claim

      - name: Dashboard realtime diagnostics emulator integration test
        run: npm run emulator:test:dashboard-realtime-diagnostics

      # 2026-09-01 종합감사(B그룹 2번): 나머지 로컬-only 에뮬레이터 통합테스트
      # 20개 중 핵심 경로 7개를 CI에 새로 배선한다. 배선 과정에서 6개가
      # 실제로 깨져 있었다(2026-08-27/08-31 백엔드 변경 - closed-beta 게이트
      # 퇴역, 3단 권한체계 registerStudentProfile 202화, NEIS 학교코드 전환,
      # 90일 만료필드 제거 - 이후 갱신 안 된 채 로컬에서만 존재해 아무도
      # 몰랐다). 전부 원인 확인 후 현재 동작에 맞게 갱신하고 통과 확인함.
      - name: Student profile emulator integration test
        run: npm run emulator:test:student-profile

      - name: Student anonymization emulator integration test
        run: npm run emulator:test:student-anonymization

      - name: Campus location emulator integration test
        run: npm run emulator:test:campus-location

      - name: School dashboard aggregate emulator integration test
        run: npm run emulator:test:school-dashboard

      - name: Protected actor emulator integration test
        run: npm run emulator:test:protected-actor

      - name: Class change cooldown emulator integration test
        run: npm run emulator:test:class-change-cooldown

      - name: Protected records emulator integration test
        run: npm run emulator:test:protected-records

      - name: Mobile class context emulator integration test
        run: npm run emulator:test:mobile-class-context

      # 2026-09-02 재감사(운영 안정성 - CI 게이트 커버리지): 위 배선 뒤에도
      # 로컬에서만 돌던 에뮬레이터 테스트가 7개 남아 있었다. 하필 그 안에
      # "App Check 강제가 실제 HTTP 경로에서 살아있는지"(appcheck),
      # "기록 저장 전체 경로"(emulator:test), "분석 멱등성"(analysis),
      # "기기 바인딩 동시성/한도"(edu2g 계열), "다액터 기록·재검토 회복
      # 시나리오"(cb5 계열)처럼 보안·데이터 정합성의 핵심이 들어 있어서,
      # 그것들만 게이트 밖에 있는 상태였다. 2026-09-02에 7개 전부 로컬에서
      # 실행해 통과를 확인하고 여기로 옮긴다 - 이제 package.json의
      # emulator:test:* 스크립트 19개가 전부 CI에서 돈다(브라우저가 필요한
      # test:frontend:*/browser 스모크만 여전히 로컬 전용, 이건 러너에
      # 브라우저가 없어서 의도적으로 제외).
      - name: App Check enforcement emulator smoke test
        run: npm run emulator:test:appcheck

      - name: Sorting record emulator smoke test
        run: npm run emulator:test

      - name: Analysis idempotency emulator smoke test
        run: npm run emulator:test:analysis

      - name: App Check enforcement HTTP smoke test
        run: npm run emulator:test:edu2g

      - name: CB5 device matrix emulator integration test
        run: npm run emulator:test:cb5-device-matrix

      - name: CB5 record/resolve recovery emulator integration test
        run: npm run emulator:test:cb5-record-resolve-recovery

  # 2026-09-09 추가: mobile/의 React+TypeScript 전환(mobile-app/) 게이트.
  # 저장소의 다른 게이트들은 functions/ 안만 본다 - eslint도 functions/
  # 범위이고, package.json의 check는 하드코딩 목록이다. mobile-app/은
  # 자기 package.json으로 도는 별도 프로젝트라, 여기 걸어두지 않으면
  # 어느 게이트에도 안 걸린 채 코드가 쌓인다.
  #
  # 이 job을 deploy-hosting의 needs에 아직 넣지 않은 것은 의도다. 전환
  # 산출물(mobile-next/)은 S5 전까지 배포에 포함되지 않으므로, 지금
  # needs로 묶으면 "배포와 실제로 상관없는 것"이 배포를 막게 된다.
  # S5에서 mobile/이 이 빌드의 산출물로 바뀔 때 needs에 넣는다.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # 이식 정합성 테스트가 여기 걸린다 - 원본 파일을 실제로 실행해서
      # 옮긴 모듈과 값을 대조하는 테스트라, 전사 오류를 여기서 잡는다.
      - name: Unit tests
        run: npm test

      # 빌드까지 돌리는 이유: 타입검사가 통과해도 index.html 주입이나
      # 스타일시트 복사가 깨질 수 있고, 그건 빌드해야만 드러난다.
      - name: Build
        run: npm run build

      # 2026-09-11 추가: CSP는 인라인 스크립트를 **바이트 sha256**으로 허용하는데,
      # 어긋나면 브라우저가 **조용히** 막는다 - 서버는 200을 주고 CI도 초록이라
      # 아무 신호가 없다. `miniapp/3second.html`이 실제로 그렇게 2026-09-01부터
      # 열흘 동안 죽어 있었고 아무도 못 봤다(누르면 아무 일도 안 났다).
      #
      # 🔴 이 job은 `deploy-hosting`의 needs에 있으므로 **여기서 막으면 어긋난
      # 바이트가 라이브로 나가지 않는다.** 그게 이 단계를 하필 이 job에 둔 이유다.
      - name: CSP inline hashes match what actually ships
        working-directory: .
        run: node scripts/checkMiniappCsp.js

  # 2026-09-10 추가: PC의 React+TypeScript 전환(pc-app/) 게이트. 위 frontend
  # job과 같은 이유이고 같은 모양이다 - pc-app/도 자기 package.json으로 도는
  # 별도 프로젝트라, 여기 걸어두지 않으면 어느 게이트에도 안 걸린다.
  #
  # 🔴 S3의 이식 정합성 테스트가 바로 그 상태였다. app.js에서 원본 함수를
  # 떼어 와 값을 대조하는 157개 검사를 만들어 놓고도 **CI에서는 한 번도 돌지
  # 않아**, 옮기다 틀린 것이 다른 사람 손에서는 안 잡혔을 것이다. 안 도는
  # 검사는 검사가 아니다(§21).
  #
  # deploy-hosting의 needs에 아직 넣지 않은 것은 frontend와 같은 이유다 -
  # 전환 산출물(pc-next/)은 S5 전까지 배포에 포함되지 않으므로, 지금 묶으면
  # 배포와 상관없는 것이 배포를 막는다. S5에서 넣는다.
  pc-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pc-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # 이식 정합성 테스트가 여기 걸린다 - 원본 app.js를 실제로 실행해서
      # 옮긴 모듈과 값을 대조하므로, 전사 오류를 여기서 잡는다.
      - name: Unit tests
        run: npm test

      # 2026-09-11: PC 빌드는 산출물에 `mobile/`을 같이 담는다 - 폰 폭(짧은 변
      # 599 이하)에서 학생 앱을 iframe으로 띄우기 때문이다. 그런데 `mobile/`은
      # gitignore된 빌드 산출물이라 **갓 체크아웃한 CI에는 없다.** 없으면
      # `pc-app/vite.config.ts`가 일부러 던진다(조용히 빈 프레임을 배포하지
      # 않으려고 2026-09-10에 넣은 장치다 - 실제로 그 폭에서 404 빈 화면이
      # 나갔던 것을 잡은 검사라 약하게 만들지 않는다).
      #
      # 🔴 그래서 이 job이 2026-09-10 a8d2f5c 이후로 계속 빨간불이었다.
      # **항상 빨간 job은 꺼진 job과 같으므로**(COMMON_STANDARDS §21-13)
      # 장치를 푸는 것이 아니라 여기서 조건을 채워 준다.
      - name: Build student app first (the PC build embeds it)
        working-directory: mobile-app
        run: npm ci && npm run build

      - name: Build
        run: npm run build

  # 2026-08-29 추가: functions/firestore.rules/firestore.indexes.json은
  # 지금까지 자동배포가 전혀 없었다 - 개발자가 로컬에서 매번 수동으로
  # `firebase deploy --only functions:<name>`을 쳐야만 실제로 반영됐다
  # (그래서 코드는 main에 merge됐는데 프로덕션엔 안 나간 상태가 여러 번
  # 있었다). 이 job이 그 수동 단계를 대체한다 - test가 통과해야만
  # 실행되고(needs: test), 아래 deploy-hosting job도 이 job이 성공해야만
  # 실행된다(needs: deploy-backend) - "규칙+functions 먼저, hosting은
  # 그 다음"이라는 순서를 job 의존성으로 강제한다.
  #
  # 필요한 사전 설정(저장소 관리자가 GitHub Actions로는 만들 수 없는,
  # 사람이 직접 해야 하는 1회성 작업): GCP에서 이 Firebase 프로젝트
  # (ai-ways-incheon)에 배포 권한을 가진 서비스계정을 만들고, 그 JSON
  # 키를 저장소 Settings > Secrets > Actions에 FIREBASE_SERVICE_ACCOUNT
  # 라는 이름으로 등록해야 이 job이 실제로 동작한다. 이 시크릿이
  # 없으면 이 job은 인증 단계에서 실패한다(의도된 동작 - 조용히
  # 건너뛰지 않고 확실하게 실패해서 알려준다). Hosting 배포용
  # firebasehosting.admin(또는 동급) 역할도 같은 서비스계정에 필요하다.
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # 2026-08-29 수정: 서비스계정 JSON을 `echo "${{ secrets.X }}" > file`로
      # 직접 쓰면, 그 JSON 안에 있는 큰따옴표(모든 JSON 키/값에 당연히
      # 있음)가 이 run: 문자열의 인용부호와 충돌해서 파일이 깨진 채로
      # 쓰인다 - 실제로 이렇게 했다가 firebase deploy가 "Failed to
      # authenticate, have you run firebase login?"로 실패하는 걸 확인했다.
      # google-github-actions/auth가 셸 문자열 치환을 거치지 않고 안전하게
      # 자격증명 파일을 써주고 GOOGLE_APPLICATION_CREDENTIALS도 알아서
      # 설정해준다.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules, indexes, and Cloud Functions
        run: firebase deploy --only firestore:rules,firestore:indexes,functions --project ai-ways-incheon --non-interactive

  # 2026-09-09 리액트 전환 S5: mobile/은 이제 저장소에 없다(빌드 산출물).
  # 그래서 여기서 mobile-app을 빌드해야 스테이징에 담을 것이 생긴다 -
  # 빌드를 빼먹으면 학생 화면이 통째로 사라지므로, stageHostingSite.js가
  # 산출물이 없으면 아예 멈추게 해 뒀다.
  # frontend job(lint/typecheck/test/build)도 needs에 넣었다. 이제 이 빌드가
  # 실제 배포물이라, 그 검사가 실패하면 배포가 나가면 안 된다.
  deploy-hosting:
    needs: [deploy-backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile-app dependencies
        run: npm ci
        working-directory: mobile-app

      - name: Build mobile app
        run: npm run build
        working-directory: mobile-app

      # 화이트리스트: 실제 사이트가 브라우저에서 fetch/import하는 파일만
      # _hosting_site로 골라 담는다(scripts/stageHostingSite.js, 로컬
      # 수동 배포와 같은 스크립트 재사용 - 화이트리스트가 CI/로컬에서
      # 갈라지지 않게). functions/(백엔드 소스), scripts/,
      # google-apps-script/, _docs/, CLAUDE.md/AGENTS.md/README.md,
      # firebase*.json/firestore.*는 여기 없으면 배포물에 안 들어간다.
      - name: Stage public files only
        run: node scripts/stageHostingSite.js

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project ai-ways-incheon --non-interactive

      # 2026-09-01 추가(재발방지): 배포된 "코드"가 아니라 배포된 "결과"(실제
      # 라이브 응답)를 확인한다. 이 스텝이 없어서 그날 도메인 이전 때 CORS
      # 허용목록 미갱신으로 모든 API가 403인 상태가 아무 신호 없이 그대로
      # 나갔다 - scripts/postDeploySmoke.js가 대표 엔드포인트 몇 개를 실제
      # 프로덕션 Origin으로 두드려서 invalid_origin/헤더 누락을 잡는다.
      - name: Post-deploy smoke test (live CORS + security headers)
        run: node scripts/postDeploySmoke.js
